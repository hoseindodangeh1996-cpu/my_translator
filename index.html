<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مترجم صوتی پیشرفته هوش مصنوعی</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --accent-color: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .swap-lang-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .icon-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .card-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .card-content {
            font-size: 1.1rem;
            min-height: 60px;
            outline: none;
            word-break: break-word;
            line-height: 1.5;
        }

        .result-card {
            background: linear-gradient(145deg, #1e1e1e, #181824);
            border-color: #3730a3;
        }

        .result-content {
            font-size: 1.3rem;
            font-weight: 700;
            color: #818cf8;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .small-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .small-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            gap: 12px;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-color);
            border: none;
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
            transition: background-color 0.2s;
        }

        .mic-btn.recording {
            background-color: var(--danger-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            height: 20px;
            text-align: center;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group select, .input-group input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .primary-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1 id="headerTitle">مترجم صوتی فارسی ⇄ ارمنی <button class="swap-lang-btn" id="swapLangBtn" title="تغییر جهت ترجمه">⇄ معکوس</button></h1>
        <button class="icon-btn" id="settingsBtn" title="تنظیمات API">⚙️</button>
    </header>

    <div class="main-container">
        <!-- Input Card -->
        <div class="card">
            <div class="card-label">
                <span id="inputLabel">متن فارسی (گفتار شما)</span>
                <span id="charCount">0 کاراکتر</span>
            </div>
            <div class="card-content" id="sourceText" contenteditable="true" placeholder="با زدن دکمه میکروفون صحبت کنید یا تایپ کنید..."></div>
            <div class="action-row">
                <button class="small-btn" id="clearBtn">پاک کردن</button>
                <button class="small-btn" id="translateNowBtn" style="background: var(--primary-color); color: white; border: none;">ترجمه کن</button>
            </div>
        </div>

        <!-- Mic Button Section -->
        <div class="mic-section">
            <button class="mic-btn" id="micBtn" title="شروع ضبط">🎙️</button>
            <div class="status-text" id="statusText">آماده برای ضبط صدا</div>
        </div>

        <!-- Result Card -->
        <div class="card result-card">
            <div class="card-label">
                <span id="outputLabel">ترجمه ارمنی (عاملیانه / ارمنستان)</span>
            </div>
            <div class="card-content result-content" id="targetText" style="direction: ltr; text-align: left;">ترجمه اینجا نمایش داده می‌شود...</div>
            <div class="action-row">
                <button class="small-btn" id="speakBtn">🔊 پخش صوتی</button>
                <button class="small-btn" id="copyBtn">📋 کپی متن</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title">تنظیمات هوش مصنوعی</div>
            <div class="input-group">
                <label>انتخاب سرویس</label>
                <select id="apiProvider">
                    <option value="groq">Groq (بسیار سریع و رایگان)</option>
                    <option value="gemini">Google Gemini</option>
                </select>
            </div>
            <div class="input-group">
                <label>کلید API (API Key)</label>
                <input type="password" id="apiKeyInput" placeholder="کلید خود را اینجا وارد کنید...">
            </div>
            <button class="primary-btn" id="saveSettingsBtn">ذخیره تنظیمات</button>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const sourceText = document.getElementById('sourceText');
        const targetText = document.getElementById('targetText');
        const clearBtn = document.getElementById('clearBtn');
        const translateNowBtn = document.getElementById('translateNowBtn');
        const speakBtn = document.getElementById('speakBtn');
        const copyBtn = document.getElementById('copyBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const apiProviderSelect = document.getElementById('apiProvider');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const charCount = document.getElementById('charCount');
        const swapLangBtn = document.getElementById('swapLangBtn');
        const inputLabel = document.getElementById('inputLabel');
        const outputLabel = document.getElementById('outputLabel');

        let isPersianToArmenian = true;
        let apiKey = localStorage.getItem('translator_api_key') || '';
        let apiProvider = localStorage.getItem('translator_provider') || 'groq';
        apiKeyInput.value = apiKey;
        apiProviderSelect.value = apiProvider;

        settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('active');
        });

        saveSettingsBtn.addEventListener('click', () => {
            apiKey = apiKeyInput.value.trim();
            apiProvider = apiProviderSelect.value;
            localStorage.setItem('translator_api_key', apiKey);
            localStorage.setItem('translator_provider', apiProvider);
            settingsModal.classList.remove('active');
            alert('تنظیمات با موفقیت ذخیره شد.');
        });

        // Swap Languages Direction
        swapLangBtn.addEventListener('click', () => {
            isPersianToArmenian = !isPersianToArmenian;
            if (isPersianToArmenian) {
                inputLabel.textContent = "متن فارسی (گفتار شما)";
                outputLabel.textContent = "ترجمه ارمنی (عاملیانه / ارمنستان)";
                targetText.style.direction = "ltr";
                targetText.style.textAlign = "left";
                sourceText.style.direction = "rtl";
                sourceText.style.textAlign = "right";
            } else {
                inputLabel.textContent = "متن ارمنی (گفتار شما)";
                outputLabel.textContent = "ترجمه فارسی روان";
                targetText.style.direction = "rtl";
                targetText.style.textAlign = "right";
                sourceText.style.direction = "ltr";
                sourceText.style.textAlign = "left";
            }
            sourceText.textContent = '';
            targetText.textContent = 'ترجمه اینجا نمایش داده می‌شود...';
            updateCharCount();
        });

        // Speech Recognition with 2-second Silence Timeout
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;
        let silenceTimer = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                statusText.textContent = 'در حال گوش دادن... صحبت کنید';
                resetSilenceTimer();
            };

            recognition.onresult = (event) => {
                resetSilenceTimer(); // Reset timer on every new speech chunk detected
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    sourceText.textContent += ' ' + finalTranscript;
                    updateCharCount();
                } else if (interimTranscript) {
                    statusText.textContent = interimTranscript;
                }
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                statusText.textContent = 'خطا در تشخیص صدا: ' + event.error;
                stopRecordingState();
            };

            recognition.onend = () => {
                stopRecordingState();
                const text = sourceText.textContent.trim();
                if (text) {
                    translateText(text);
                }
            };
        } else {
            statusText.textContent = 'مرورگر شما از تشخیص صوتی پشتیبانی نمی‌کند.';
            micBtn.style.opacity = '0.5';
            micBtn.disabled = true;
        }

        function resetSilenceTimer() {
            if (silenceTimer) clearTimeout(silenceTimer);
            // 2 seconds of total silence automatically stops recording and triggers translation
            silenceTimer = setTimeout(() => {
                if (isRecording && recognition) {
                    recognition.stop();
                }
            }, 2000);
        }

        function stopRecordingState() {
            isRecording = false;
            if (silenceTimer) clearTimeout(silenceTimer);
            micBtn.classList.remove('recording');
            statusText.textContent = 'آماده برای ضبط صدا';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                if (!apiKey) {
                    settingsModal.classList.add('active');
                    alert('لطفاً ابتدا کلید API خود را در تنظیمات وارد کنید.');
                    return;
                }
                sourceText.textContent = '';
                recognition.lang = isPersianToArmenian ? 'fa-IR' : 'hy-AM';
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        });

        sourceText.addEventListener('input', updateCharCount);
        function updateCharCount() {
            charCount.textContent = sourceText.textContent.length + ' کاراکتر';
        }

        clearBtn.addEventListener('click', () => {
            sourceText.textContent = '';
            targetText.textContent = 'ترجمه اینجا نمایش داده می‌شود...';
            updateCharCount();
        });

        translateNowBtn.addEventListener('click', () => {
            const text = sourceText.textContent.trim();
            if (text) translateText(text);
        });

        // AI Translation Function
        async function translateText(text) {
            if (!apiKey) {
                settingsModal.classList.add('active');
                alert('لطفاً ابتدا کلید API را وارد کنید.');
                return;
            }

            targetText.textContent = 'در حال ترجمه روان...';
            statusText.textContent = 'ارسال به هوش مصنوعی...';

            let systemPrompt = "";
            if (isPersianToArmenian) {
                systemPrompt = "You are a professional native translator from Persian to colloquial, everyday spoken Armenian (Armenia dialect, Eastern Armenian). Translate the given Persian sentence into natural, fluent colloquial Armenian used daily by native speakers in Yerevan. Output ONLY the translated Armenian text without any quotes, explanations, or extra remarks.";
            } else {
                systemPrompt = "You are a professional native translator from Eastern Armenian to natural, fluent everyday Persian. Translate the given Armenian text into fluent, conversational Persian. Output ONLY the translated Persian text without any quotes, explanations, or extra remarks.";
            }

            try {
                let responseData = '';
                if (apiProvider === 'groq') {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'openai/gpt-oss-120b',
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: text }
                            ],
                            temperature: 0.3
                        })
                    });
                    const data = await res.json();
                    if (!res.ok || data.error) {
                        throw new Error((data.error && data.error.message) || `خطای HTTP ${res.status} از Groq`);
                    }
                    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                        throw new Error('پاسخ نامعتبر از Groq دریافت شد.');
                    }
                    responseData = data.choices[0].message.content;
                } else {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: 'user', parts: [{ text: `${systemPrompt}\n\nText: ${text}` }] }]
                        })
                    });
                    const data = await res.json();
                    if (!res.ok || data.error) {
                        throw new Error((data.error && data.error.message) || `خطای HTTP ${res.status} از Gemini`);
                    }
                    if (!data.candidates || !data.candidates[0]) {
                        throw new Error('پاسخ نامعتبر از Gemini دریافت شد.');
                    }
                    responseData = data.candidates[0].content.parts[0].text;
                }

                targetText.textContent = responseData.trim();
                statusText.textContent = 'ترجمه انجام شد.';
            } catch (err) {
                console.error(err);
                targetText.textContent = 'خطا در ارتباط با هوش مصنوعی';
                statusText.textContent = 'خطا: ' + err.message;
            }
        }

        // Robust Text-to-Speech with Fallbacks
        speakBtn.addEventListener('click', () => {
            const textToSpeak = targetText.textContent;
            if (!textToSpeak || textToSpeak.includes('نمایش داده می‌شود') || textToSpeak.includes('خطا')) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                
                // Target language voice setting
                const targetLangCode = isPersianToArmenian ? 'hy-AM' : 'fa-IR';
                utterance.lang = targetLangCode;
                utterance.rate = 0.9;

                // Try finding matching voice on mobile
                const voices = window.speechSynthesis.getVoices();
                const specificVoice = voices.find(v => v.lang === targetLangCode || v.lang.startsWith(isPersianToArmenian ? 'hy' : 'fa'));
                if (specificVoice) {
                    utterance.voice = specificVoice;
                }

                utterance.onerror = (e) => {
                    console.error('TTS Error:', e);
                    alert('پخش صوتی روی این مرورگر برای این زبان پشتیبانی نمی‌شود یا موتور صوتی نصب نیست.');
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert('مرورگر شما از پخش صوتی پشتیبانی نمی‌کند.');
            }
        });

        copyBtn.addEventListener('click', () => {
            const textToCopy = targetText.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ کپی شد';
                setTimeout(() => copyBtn.textContent = originalText, 2000);
            });
        });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => reg.update());
            });
        }
    </script>
</body>
</html>
